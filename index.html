
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football For Life: Rogue To Glory</title>
<style>
:root {
  --bg:#101713;
  --panel:#18231d;
  --panel2:#202d25;
  --line:#34463a;
  --green:#a5d66b;
  --green2:#6d9d43;
  --cream:#edf0e6;
  --muted:#a1aea3;
  --gold:#d6b76a;
  --red:#bd716c;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--cream);
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
}
button,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#app{min-height:100vh}
.hidden{display:none!important}
.eyebrow{
  color:var(--green);font-size:11px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase
}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(36px,7vw,72px);line-height:.98;letter-spacing:-3px}
h2{font-size:27px;letter-spacing:-.7px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:12px}
button:focus-visible,select:focus-visible{
  outline:2px solid var(--green);outline-offset:3px
}

/* START MENU */
.menu{
  min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;
  max-width:1500px;margin:auto;padding:48px;gap:50px;align-items:center
}
.brand{font-weight:900;letter-spacing:2px;font-size:13px}
.brand span{color:var(--green)}
.hero-copy{max-width:680px}
.hero-copy h1{margin:25px 0}
.hero-copy h1 em{font-style:normal;color:var(--green)}
.hero-copy p{color:var(--muted);line-height:1.7;max-width:470px}
.pitch-art{
  margin-top:38px;max-width:520px;aspect-ratio:1.8;
  border:1px solid #53674d;border-radius:14px;overflow:hidden;
  position:relative;background:
  linear-gradient(90deg,transparent 49.7%,#ffffff25 50%,transparent 50.3%),
  repeating-linear-gradient(0deg,#284b35 0 45px,#31583c 45px 90px);
}
.pitch-art:before{
  content:"";position:absolute;inset:12%;border:1px solid #ffffff55
}
.pitch-art:after{
  content:"";position:absolute;width:25%;aspect-ratio:1;border:1px solid #ffffff55;
  border-radius:50%;left:37.5%;top:calc(50% - 12.5%)
}
.pitch-box{position:absolute;left:32%;width:36%;height:18%;border:1px solid #ffffff55}
.pitch-box.top{top:12%}.pitch-box.bottom{bottom:12%}
.menu-panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:28px;box-shadow:0 24px 70px #0005
}
.menu-panel h2{margin:8px 0}
.perks{display:grid;gap:10px;margin:22px 0}
.perk{
  width:100%;text-align:left;background:#202c24;border:1px solid var(--line);
  color:var(--cream);padding:15px;border-radius:11px;transition:.18s
}
.perk:hover{border-color:#829c6d;transform:translateY(-1px)}
.perk.selected{border:1px solid var(--green);background:#293c2b;box-shadow:inset 3px 0 var(--green)}
.perk-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.perk-name{font-weight:800}
.perk-number{font-size:10px;color:var(--muted);letter-spacing:1px}
.perk-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}
.tick{color:var(--green);font-weight:900}
.primary{
  background:var(--green);color:#142016;border:0;border-radius:9px;
  padding:14px 20px;font-weight:900;width:100%
}
.primary:hover{background:#b8e58a}
.secondary{
  background:transparent;color:var(--cream);border:1px solid var(--line);
  border-radius:8px;padding:10px 14px
}
.secondary:hover{border-color:var(--green)}
.menu-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px}

/* MAIN APP */
.topbar{
  height:68px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;padding:0 28px;
  background:#131c16;position:sticky;top:0;z-index:10
}
.topbar .brand{font-size:12px}
.run-label{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 68px)}
.sidebar{
  border-right:1px solid var(--line);padding:22px 14px;background:#141d17
}
.nav-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin:8px 10px 12px}
.nav-btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  color:#bdc8bd;background:transparent;border:0;border-radius:8px;
  padding:12px 11px;margin:3px 0;font-size:13px
}
.nav-btn:hover,.nav-btn.active{background:#26372a;color:var(--green)}
.nav-icon{width:20px;text-align:center;font-size:16px}
.main{padding:30px;min-width:0;max-width:1500px;width:100%;margin:auto}
.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}
.page-head h2{margin:5px 0 0}
.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:20px
}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.panel-title h3{margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
.stat strong{font-size:24px;display:block}
.stat span{font-size:11px;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}
.badge{
  display:inline-block;border:1px solid #63735e;color:var(--green);
  border-radius:30px;padding:5px 9px;font-size:10px;font-weight:800;
  letter-spacing:.6px
}
.badge.gold{color:var(--gold);border-color:#796b48}
.badge.grey{color:#c0c5c0;border-color:#69716b}

/* MAP */
.map-wrap{
  position:relative;overflow:hidden;border:1px solid #485b4b;
  border-radius:14px;min-height:590px;
  background:
    radial-gradient(ellipse at 25% 20%,#465c4930,transparent 30%),
    radial-gradient(ellipse at 75% 75%,#52634b35,transparent 35%),
    linear-gradient(135deg,#263b31,#1d3029 48%,#293d32);
}
.map-wrap:before{
  content:"";position:absolute;inset:0;opacity:.23;
  background-image:repeating-linear-gradient(25deg,transparent 0 65px,#a3b39b 66px,#a3b39b 67px,transparent 68px 130px);
  pointer-events:none
}
.map-wrap:after{
  content:"";position:absolute;inset:0;opacity:.16;
  background-image:radial-gradient(#dce5d7 1px,transparent 1px);
  background-size:18px 18px;pointer-events:none
}
.map-water{
  position:absolute;right:-5%;top:-5%;width:23%;height:110%;
  background:linear-gradient(90deg,transparent,#526c7450);
  transform:rotate(7deg);border-left:2px solid #8ca3a044
}
.map-road{
  position:absolute;height:2px;background:#d3c79a66;transform-origin:left;
  z-index:1;pointer-events:none
}
.map-road.major{height:3px;background:#d7c89a88}
.map-title{
  position:absolute;top:17px;left:20px;z-index:3;
  font-size:10px;letter-spacing:2px;color:#dce4d6
}
.map-compass{
  position:absolute;right:20px;top:18px;z-index:3;color:#dce4d6;
  font-size:11px;text-align:center
}
.map-point{
  position:absolute;z-index:4;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border:0;background:transparent;color:#eef0e7;padding:4px;
  min-width:76px
}
.stadium{
  width:35px;height:29px;border:1px solid #d5dfcb;
  background:#1c2a22;border-radius:7px 7px 5px 5px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px #0006;position:relative
}
.stadium:before{
  content:"";position:absolute;top:-5px;left:4px;right:4px;height:8px;
  border:1px solid #d5dfcb;border-bottom:0;border-radius:9px 9px 0 0;
  background:#657c5b
}
.stadium svg{width:21px;height:17px;position:relative;z-index:1}
.map-name{
  font-size:10px;font-weight:800;text-shadow:0 2px 5px #000;
  white-space:nowrap;background:#17231dd9;padding:3px 6px;border-radius:4px
}
.map-point:hover .stadium{border-color:var(--green);background:#38523a}
.map-point.next .stadium{border:2px solid var(--green);box-shadow:0 0 0 5px #a5d66b25,0 4px 15px #0008}
.map-point.home .stadium{background:#536b37;border-color:#e5d39a}
.map-point.done{opacity:.5}
.map-legend{
  display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;
  color:var(--muted);font-size:11px
}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--green)}
.legend-dot.grey{background:#849087}.legend-dot.gold{background:var(--gold)}
.map-info{margin-top:12px;font-size:12px;color:var(--muted);min-height:18px}

/* TABLES AND LISTS */
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.8px;font-weight:700}
th,td{padding:12px 10px;border-bottom:1px solid #344239}
tr:last-child td{border-bottom:0}
tr.user-row td{color:var(--green);background:#a5d66b0b}
.fixture-list{display:grid;gap:8px}
.fixture{
  display:grid;grid-template-columns:65px 1fr auto;gap:12px;
  align-items:center;background:#202c24;border:1px solid var(--line);
  border-radius:9px;padding:13px
}
.fixture-date{font-size:11px;color:var(--muted)}
.fixture-teams{font-size:13px;font-weight:750}
.fixture-place{font-size:11px;color:var(--muted);margin-top:4px}
.fixture-status{font-size:10px;color:var(--green);text-align:right}
.fixture.cup{border-color:#766746}
.section-label{font-size:10px;color:var(--green);letter-spacing:1.5px;margin:24px 0 10px}

/* SQUAD AND TACTICS */
.squad-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.player-slot{
  border:1px solid var(--line);background:#202b24;border-radius:9px;
  padding:12px;min-width:0
}
.player-slot .rating{font-size:21px;font-weight:900;color:#c4cbc4}
.player-slot .position{font-size:10px;color:var(--green);font-weight:900}
.player-slot .player-name{font-size:12px;font-weight:750;margin:5px 0}
.player-slot .tier{font-size:9px;color:var(--muted);letter-spacing:1px}
.select-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
select{
  width:100%;background:#202c24;color:var(--cream);
  border:1px solid var(--line);border-radius:8px;padding:11px
}
.pitch-board{
  background:repeating-linear-gradient(0deg,#31543a 0 55px,#294b34 55px 110px);
  border:1px solid #68806a;border-radius:12px;padding:15px;
  min-height:490px;display:flex;flex-direction:column;justify-content:space-around;
  position:relative;overflow:hidden
}
.pitch-board:before{
  content:"";position:absolute;inset:10px;border:1px solid #ffffff50;pointer-events:none
}
.pitch-board:after{
  content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1px solid #ffffff50
}
.formation-line{display:flex;justify-content:space-evenly;gap:4px;position:relative;z-index:1}
.formation-player{
  width:42px;height:42px;border-radius:50%;background:#e8eee0;color:#203126;
  border:2px solid #a5d66b;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;box-shadow:0 3px 7px #0005
}
.formation-player small{font-size:8px}
.tactics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sub-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sub-slot{background:#202c24;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:11px}
.callout{padding:13px;background:#26372a;border-left:3px solid var(--green);border-radius:5px;color:#d6e2d3;font-size:12px;line-height:1.6}

/* SMALL SCREENS */
@media(max-width:900px){
 .menu{grid-template-columns:1fr;padding:28px;gap:24px}
 .hero-copy{max-width:none}
 .pitch-art{max-width:100%;margin-top:20px}
 .layout{grid-template-columns:1fr}
 .sidebar{position:sticky;top:68px;z-index:9;display:flex;overflow-x:auto;
  border-right:0;border-bottom:1px solid var(--line);padding:8px}
 .nav-label{display:none}
 .nav-btn{width:auto;white-space:nowrap;padding:10px;font-size:11px}
 .main{padding:20px}
 .two-col,.tactics-grid{grid-template-columns:1fr}
 .map-wrap{min-height:560px}
}
@media(max-width:560px){
 .menu{padding:20px}
 .menu-panel{padding:19px}
 .topbar{padding:0 15px}
 .main{padding:14px}
 .stat-grid{grid-template-columns:repeat(2,1fr)}
 .squad-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .page-head{align-items:flex-start;flex-direction:column}
 .map-wrap{min-height:500px}
 .map-point{min-width:60px}
 .map-name{font-size:8px}
 .stadium{width:29px;height:25px}
 .fixture{grid-template-columns:45px 1fr auto;padding:10px}
 .fixture-teams{font-size:11px}
 .run-label{display:none}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* -----------------------------
   GAME DATA
------------------------------ */

const CLUBS = [
  {name:"Chester",x:35,y:43},
  {name:"Warrington",x:53,y:35},
  {name:"Wrexham",x:27,y:53},
  {name:"Wirral",x:24,y:37},
  {name:"Stoke",x:70,y:65},
  {name:"Salford",x:60,y:25},
  {name:"St Helens",x:47,y:30},
  {name:"Blackpool",x:31,y:10},
  {name:"Bolton",x:62,y:15},
  {name:"Blackburn",x:70,y:22},
  {name:"Crewe",x:51,y:59},
  {name:"Rochdale",x:75,y:34},
  {name:"Sandwell",x:82,y:76},
  {name:"Redditch",x:88,y:91},
  {name:"West Brom",x:82,y:65},
  {name:"Ellesmere Port",x:34,y:32,home:true}
];

const PERKS = [
  {id:"home",name:"Home Advantage",desc:"Increase your odds of winning at home."},
  {id:"captain",name:"Captain My Captain",desc:"Your captain gains bonus stats."},
  {id:"roller",name:"High Roller",desc:"Reroll all card rewards once, except Big Matches."},
  {id:"training",name:"Training Specialist",desc:"Train twice a week."},
  {id:"scout",name:"Lucky Scout",desc:"Your first card rewards are higher rarity."}
];

const FORMATIONS = {
  "4-4-2":[2,4,4,1],
  "4-3-3":[3,3,3,1],
  "4-2-3-1":[1,3,2,4],
  "5-3-2":[2,3,5,1],
  "3-4-1-2":[2,1,4,3]
};

/* Coordinates are approximate relative positions for a clean
   regional game map, not a navigation map. */

const STATE = {
  screen:"menu",
  selectedPerk:null,
  runStarted:false,
  formation:"4-4-2",
  squad:[],
  lineup:[],
  substitutes:[],
  fixtures:[],
  table:[],
  currentFixture:0,
  cupRounds:[],
  cupProgress:0,
  cupEliminated:false,
  trainingUsed:0,
  selectedLocation:null
};

const app=document.getElementById("app");

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function shuffle(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

/* -----------------------------
   START MENU
------------------------------ */

function renderMenu(){
  app.innerHTML=`
  <main class="menu">
    <section class="hero-copy">
      <div class="brand">FOOTBALL <span>FOR LIFE</span></div>
      <div class="eyebrow" style="margin-top:45px">A football roguelite</div>
      <h1>FOOTBALL<br>FOR LIFE:<br><em>ROGUE TO GLORY.</em></h1>
      <p>Build your squad. Navigate the season. Take on the region.
      Every run begins with a new challenge.</p>
      <div class="pitch-art" aria-label="Stylised football pitch">
        <div class="pitch-box top"></div>
        <div class="pitch-box bottom"></div>
      </div>
    </section>

    <section class="menu-panel">
      <div class="eyebrow">New campaign</div>
      <h2>Choose your perk</h2>
      <p class="muted small">Choose one perk to shape your run. Your choice is locked in when you start.</p>
      <div class="perks" id="perk-list">
        ${PERKS.map((p,i)=>`
          <button class="perk" data-perk="${p.id}">
            <div class="perk-top">
              <span class="perk-name">${escapeHTML(p.name)}</span>
              <span class="perk-number">PERK 0${i+1}</span>
            </div>
            <div class="perk-desc">${escapeHTML(p.desc)}</div>
            <div class="tick hidden">✓ SELECTED</div>
          </button>
        `).join("")}
      </div>
      <button class="primary" id="start-run" disabled>SELECT A PERK TO CONTINUE</button>
      <div class="menu-note">One perk per run · 16 clubs · 30 league fixtures · Knockout cup</div>
    </section>
  </main>`;

  document.querySelectorAll("[data-perk]").forEach(button=>{
    button.addEventListener("click",()=>{
      STATE.selectedPerk=button.dataset.perk;
      document.querySelectorAll("[data-perk]").forEach(b=>{
        const chosen=b.dataset.perk===STATE.selectedPerk;
        b.classList.toggle("selected",chosen);
        b.querySelector(".tick").classList.toggle("hidden",!chosen);
      });
      const start=document.getElementById("start-run");
      start.disabled=false;
      start.textContent="START YOUR RUN";
    });
  });

  document.getElementById("start-run").addEventListener("click",startRun);
}

/* -----------------------------
   CREATE A RUN
------------------------------ */

function startRun(){
  if(!STATE.selectedPerk)return;

  STATE.squad=[];
  STATE.squad.push(makePlayer("Goalkeeper","GK"));
  for(let i=0;i<13;i++){
    STATE.squad.push(makePlayer("Outfield player",randomPosition()));
  }

  STATE.lineup=STATE.squad.slice(0,11).map(p=>p.id);
  STATE.substitutes=STATE.squad.slice(11,14).map(p=>p.id);
  STATE.fixtures=generateFixtures();
  STATE.table=CLUBS.map(c=>({
    name:c.name,played:0,w:0,d:0,l:0,gf:0,ga:0,pts:0
  }));
  STATE.currentFixture=0;
  STATE.cupRounds=generateCup();
  STATE.cupProgress=0;
  STATE.cupEliminated=false;
  STATE.trainingUsed=0;
  STATE.runStarted=true;
  STATE.screen="map";
  renderApp();
}

let playerCounter=0;
function makePlayer(label,position){
  playerCounter++;
  return {
    id:"p"+playerCounter,
    name:label+" "+String(playerCounter).padStart(2,"0"),
    position,
    rating:50,
    tier:"GREY"
  };
}
function randomPosition(){
  return shuffle(["CB","CB","LB","RB","CM","CM","CDM","CAM","LW","RW","ST","ST"])[0];
}

/* -----------------------------
   DOUBLE ROUND ROBIN FIXTURES
   16 clubs = 30 matches per club
------------------------------ */

function generateFixtures(){
  const names=CLUBS.map(c=>c.name);
  const rounds=[];
  let teams=[...names];

  for(let round=0;round<15;round++){
    const matches=[];
    for(let i=0;i<8;i++){
      let home=teams[i],away=teams[15-i];
      if((round+i)%2===1)[home,away]=[away,home];
      matches.push({home,away,round:round+1,played:false});
    }
    rounds.push(matches);
    teams=[teams[0],teams[15],...teams.slice(1,15-1)];
  }

  const returnRounds=rounds.map((matches,index)=>
    matches.map(m=>({
      home:m.away,away:m.home,round:index+16,played:false
    }))
  );

  const all=[...rounds,...returnRounds];
  return shuffle(all).map((round,index)=>({
    week:index+1,
    matches:round
  }));
}

/* -----------------------------
   RANDOM CUP DRAW
------------------------------ */

function generateCup(){
  const entrants=shuffle(CLUBS.map(c=>c.name));
  const rounds=[];
  let current=entrants;

  for(const stage of ["Round of 16","Quarter-finals","Semi-finals","Final"]){
    const pairings=[];
    for(let i=0;i<current.length;i+=2){
      pairings.push({
        home:"Football For Life",
        away:current[i+1]||current[i],
        stage,
        completed:false
      });
    }
    rounds.push({stage,pairings});
    current=current.filter((_,i)=>i%2===0);
  }
  return rounds;
}

/* -----------------------------
   MAIN APP SHELL
------------------------------ */

function renderApp(){
  app.innerHTML=`
    <header class="topbar">
      <div class="brand">FOOTBALL <span>FOR LIFE</span> : ROGUE TO GLORY</div>
      <div class="run-label">SEASON ONE · ${escapeHTML(PERKS.find(p=>p.id===STATE.selectedPerk)?.name||"No perk")}</div>
    </header>
    <div class="layout">
      <aside class="sidebar">
        <div class="nav-label">YOUR CAMPAIGN</div>
        ${navButton("map","⌖","Map")}
        ${navButton("training","✚","Training")}
        ${navButton("fixtures","▤","Fixtures")}
        ${navButton("table","▥","League Table")}
        ${navButton("tactics","⚑","Tactics")}
      </aside>
      <main class="main" id="main-view"></main>
    </div>
  `;
  document.querySelectorAll("[data-screen]").forEach(button=>{
    button.addEventListener("click",()=>goTo(button.dataset.screen));
  });
  renderScreen();
}
function navButton(id,icon,label){
  return `<button class="nav-btn ${STATE.screen===id?"active":""}" data-screen="${id}">
    <span class="nav-icon">${icon}</span>${label}
  </button>`;
}
function goTo(screen){
  STATE.screen=screen;
  renderApp();
}
function renderScreen(){
  const view=document.getElementById("main-view");
  if(STATE.screen==="map")view.innerHTML=mapScreen();
  if(STATE.screen==="training")view.innerHTML=trainingScreen();
  if(STATE.screen==="fixtures")view.innerHTML=fixturesScreen();
  if(STATE.screen==="table")view.innerHTML=tableScreen();
  if(STATE.screen==="tactics")view.innerHTML=tacticsScreen();
  bindScreenActions();
}

/* -----------------------------
   MAP SCREEN
------------------------------ */

function mapScreen(){
  const next=getNextFixture();
  const nextLocation=next?next.away:null;

  const roads=[
    [15,32,65,24,"major"],[18,58,58,-16,""],
    [25,78,58,-22,""],[30,10,40,62,"major"],
    [48,15,25,60,""],[52,30,32,45,"major"],
    [20,45,72,32,""]
  ];

  return `
    <div class="page-head">
      <div><div class="eyebrow">Your campaign</div><h2>Regional map</h2>
      <div class="muted small">North West and surrounding regions</div></div>
      <span class="badge">SEASON IN PROGRESS</span>
    </div>
    <div class="stat-grid">
      <div class="stat"><strong>${STATE.currentFixture}/30</strong><span>League fixtures</span></div>
      <div class="stat"><strong>${STATE.table.find(t=>t.name==="Ellesmere Port")?.pts||0}</strong><span>League points</span></div>
      <div class="stat"><strong>${STATE.cupEliminated?"OUT":"ACTIVE"}</strong><span>Cup status</span></div>
      <div class="stat"><strong>14</strong><span>Squad players</span></div>
    </div>
    <section class="map-wrap">
      <div class="map-water"></div>
      <div class="map-title">NORTH WEST REGIONAL FOOTBALL MAP</div>
      <div class="map-compass">N<br>↑</div>
      ${roads.map(r=>`<div class="map-road ${r[4]}" style="left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;transform:rotate(${r[3]}deg)"></div>`).join("")}
      ${CLUBS.map((c,i)=>{
        const isHome=c.name==="Ellesmere Port";
        const isNext=c.name===nextLocation;
        const done=STATE.fixtures.slice(0,STATE.currentFixture).some(f=>
          f.matches.some(m=>m.away===c.name||m.home===c.name)
        );
        return `
          <button class="map-point ${isHome?"home":""} ${isNext?"next":""} ${done&&!isHome?"done":""}"
            style="left:${c.x}%;top:${c.y}%"
            data-location="${escapeHTML(c.name)}"
            aria-label="${escapeHTML(c.name)}">
            <span class="stadium">
              <svg viewBox="0 0 24 18" fill="none" aria-hidden="true">
                <path d="M3 7L12 2L21 7V15H3V7Z" stroke="#e8eddf" stroke-width="1.2"/>
                <path d="M6 8H18V15H6V8Z" fill="#8ca47c" stroke="#e8eddf" stroke-width=".8"/>
                <path d="M9 10H15M9 12H15" stroke="#26392a" stroke-width="1"/>
              </svg>
            </span>
            <span class="map-name">${escapeHTML(c.name)}</span>
          </button>
        `;
      }).join("")}
    </section>
    <div class="map-legend">
      <span><i class="legend-dot"></i>Next fixture</span>
      <span><i class="legend-dot gold"></i>Football For Life</span>
      <span><i class="legend-dot grey"></i>Other clubs</span>
    </div>
    <div class="map-info" id="map-info">Select a stadium to view its location.</div>
    <div class="two-col" style="margin-top:18px">
      <section class="panel">
        <div class="panel-title"><h3>Next league fixture</h3><span class="badge">WEEK ${next?.week||"—"}</span></div>
        ${next?`
          <div style="font-size:20px;font-weight:850">Football For Life</div>
          <div class="muted small" style="margin:5px 0 12px">away at ${escapeHTML(next.away)}</div>
          <div class="muted small">${escapeHTML(next.venue)}</div>
        `:`<p class="muted small">The league season is complete.</p>`}
        <button class="secondary" style="margin-top:14px" data-go="fixtures">View fixtures</button>
      </section>
      <section class="panel">
        <div class="panel-title"><h3>Home ground</h3><span class="badge gold">HOME</span></div>
        <div style="font-size:20px;font-weight:850">C of E College</div>
        <p class="muted small">Ellesmere Port · Football For Life</p>
      </section>
    </div>
  `;
}

/* Stadium location info and screen navigation */
function bindScreenActions(){
  document.querySelectorAll("[data-location]").forEach(button=>{
    button.addEventListener("click",()=>{
      const name=button.dataset.location;
      const info=document.getElementById("map-info");
      if(info){
        info.textContent=name==="Ellesmere Port"
          ?"Football For Life · C of E College · Home ground"
          :name+" · Regional club location";
      }
    });
  });
  document.querySelectorAll("[data-go]").forEach(button=>{
    button.addEventListener("click",()=>goTo(button.dataset.go));
  });
  document.querySelectorAll("[data-formation]").forEach(button=>{
    button.addEventListener("click",()=>{
      STATE.formation=button.dataset.formation;
      renderScreen();
    });
  });
  document.querySelectorAll("[data-player-slot]").forEach(select=>{
    select.addEventListener("change",()=>{
      const slot=Number(select.dataset.playerSlot);
      const playerId=select.value;
      if(!playerId)return;
      const used=STATE.lineup.indexOf(playerId);
      if(used!==-1)STATE.lineup[used]=STATE.lineup[slot];
      STATE.lineup[slot]=playerId;
      renderScreen();
    });
  });
}

/* -----------------------------
   FIXTURE HELPERS
------------------------------ */

function getNextFixture(){
  const round=STATE.fixtures[STATE.currentFixture];
  if(!round)return null;
  const match=round.matches.find(m=>m.home==="Ellesmere Port"||m.away==="Ellesmere Port");
  if(!match)return null;
  return {
    week:round.week,
    home:match.home,
    away:match.away,
    venue:match.home==="Ellesmere Port"?"C of E College":match.home
  };
}

function fixturesScreen(){
  const all=STATE.fixtures.map(round=>{
    const match=round.matches.find(m=>m.home==="Ellesmere Port"||m.away==="Ellesmere Port");
    return match?{week:round.week,...match}:null;
  }).filter(Boolean);

  return `
    <div class="page-head">
      <div><div class="eyebrow">Season schedule</div><h2>Fixtures</h2>
      <div class="muted small">30 league matches · Home and away</div></div>
      <span class="badge">${STATE.currentFixture} / 30 PLAYED</span>
    </div>
    <section class="panel">
      <div class="panel-title"><h3>League fixtures</h3><span class="muted small">Randomised order</span></div>
      <div class="fixture-list">
        ${all.map(f=>`
          <div class="fixture">
            <div class="fixture-date">WEEK ${f.week}</div>
            <div>
              <div class="fixture-teams">${escapeHTML(f.home==="Ellesmere Port"?"Football For Life":f.home)} vs ${escapeHTML(f.away==="Ellesmere Port"?"Football For Life":f.away)}</div>
              <div class="fixture-place">${f.home==="Ellesmere Port"?"C of E College":escapeHTML(f.home)} · ${f.home==="Ellesmere Port"?"Home":"Away"}</div>
            </div>
            <div class="fixture-status">${f.week<=STATE.currentFixture?"COMPLETED":f.week===STATE.currentFixture+1?"NEXT":"UPCOMING"}</div>
          </div>
        `).join("")}
      </div>
    </section>
    <div class="section-label">CUP COMPETITION</div>
    ${cupScreenMarkup()}
  `;
}

function cupScreenMarkup(){
  return `
    <section class="panel">
      <div class="panel-title"><h3>Football For Life Cup</h3><span class="badge gold">BOSS MATCHES</span></div>
      ${STATE.cupRounds.map((round,index)=>`
        <div class="section-label">${escapeHTML(round.stage)} ${index===0?"· AFTER FIXTURE 8":index===1?"· AFTER FIXTURE 16":index===2?"· AFTER FIXTURE 24":"· AFTER THE SEASON"}</div>
        ${round.pairings.map((pair,i)=>`
          <div class="fixture cup">
            <div class="fixture-date">CUP</div>
            <div>
              <div class="fixture-teams">${escapeHTML(pair.home)} vs ${escapeHTML(pair.away)}</div>
              <div class="fixture-place">C of E College · Ellesmere Port</div>
            </div>
            <div class="fixture-status">${pair.completed?"COMPLETED":index===0?"DRAWN":"PENDING"}</div>
          </div>
        `).join("")}
      `).join("")}
      <p class="muted small" style="margin:15px 0 0">Cup opponents visit C of E College for every round.</p>
    </section>
  `;
}

/* -----------------------------
   LEAGUE TABLE
------------------------------ */

function tableScreen(){
  const sorted=[...STATE.table].sort((a,b)=>
    b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf
  );
  return `
    <div class="page-head">
      <div><div class="eyebrow">The league</div><h2>League table</h2>
      <div class="muted small">All 16 clubs · 30 fixtures per club</div></div>
      <span class="badge">LIVE TABLE</span>
    </div>
    <section class="panel">
      <div class="table-scroll">
        <table>
          <thead><tr><th>#</th><th>CLUB</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead>
          <tbody>
          ${sorted.map((t,i)=>`
            <tr class="${t.name==="Ellesmere Port"?"user-row":""}">
              <td>${i+1}</td><td>${t.name==="Ellesmere Port"?"Football For Life":escapeHTML(t.name)}</td>
              <td>${t.played}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
              <td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga}</td><td><strong>${t.pts}</strong></td>
            </tr>
          `).join("")}
          </tbody>
        </table>
      </div>
      <p class="muted small" style="margin:15px 0 0">The table will update when match results are added to the game.</p>
    </section>
  `;
}

/* -----------------------------
   TRAINING SCREEN
------------------------------ */

function trainingScreen(){
  const max=STATE.selectedPerk==="training"?2:1;
  return `
    <div class="page-head">
      <div><div class="eyebrow">Player development</div><h2>Training</h2>
      <div class="muted small">Prepare your squad for the next fixture</div></div>
      <span class="badge">${STATE.trainingUsed} / ${max} SESSIONS USED</span>
    </div>
    <div class="two-col">
      <section class="panel">
        <h3>Weekly training</h3>
        <p class="muted small">Your training allowance depends on your selected perk.</p>
        <div class="stat" style="margin:16px 0">
          <strong>${max-STATE.trainingUsed}</strong><span>Sessions remaining this week</span>
        </div>
        <button class="primary" id="training-placeholder" disabled>TRAINING SYSTEM COMING LATER</button>
      </section>
      <section class="panel">
        <h3>Your perk</h3>
        <div class="eyebrow">${escapeHTML(PERKS.find(p=>p.id===STATE.selectedPerk)?.name||"")}</div>
        <p class="muted small">${escapeHTML(PERKS.find(p=>p.id===STATE.selectedPerk)?.desc||"")}</p>
      </section>
    </div>
    <div class="callout" style="margin-top:16px">Training sessions and player improvements will be connected when the player database and training rules are added.</div>
  `;
}

/* -----------------------------
   TACTICS SCREEN
------------------------------ */

function tacticsScreen(){
  const shape=FORMATIONS[STATE.formation];
  const players=STATE.squad;
  const chosen=STATE.lineup.map(id=>players.find(p=>p.id===id)).filter(Boolean);
  const rows=shape.map((count,index)=>Array.from({length:count},(_,j)=>({line:index,slot:j})));
  const ordered=[...rows].reverse();
  let slot=0;

  const formationHTML=ordered.map(row=>`
    <div class="formation-line">
      ${row.map(()=>{
        const p=chosen[slot]||players[slot];
        const n=slot++;
        return `<div class="formation-player" title="${escapeHTML(p?.name||"Player")}">${p?.position||"?"}</div>`;
      }).join("")}
    </div>
  `).join("");

  return `
    <div class="page-head">
      <div><div class="eyebrow">Squad management</div><h2>Tactics</h2>
      <div class="muted small">Pick your formation and starting eleven</div></div>
      <span class="badge grey">GREY TIER SQUAD</span>
    </div>
    <section class="panel" style="margin-bottom:16px">
      <div class="panel-title"><h3>Formation</h3><span class="muted small">Goalkeeper always at the bottom</span></div>
      <div class="select-row">
        <select id="formation-select">
          ${Object.keys(FORMATIONS).map(f=>`<option ${STATE.formation===f?"selected":""}>${f}</option>`).join("")}
        </select>
        <div class="callout">Choose one of the five available formations. Your goalkeeper stays at the bottom of the pitch.</div>
      </div>
    </section>
    <div class="tactics-grid">
      <section class="panel">
        <div class="panel-title"><h3>Pitch layout</h3><span class="badge">STARTING XI</span></div>
        <div class="pitch-board">
          ${formationHTML}
          <div class="formation-line"><div class="formation-player">GK</div></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-title"><h3>Starting eleven</h3><span class="muted small">14 players total</span></div>
        <div style="display:grid;gap:9px">
          ${players.slice(0,11).map((p,i)=>`
            <label class="small">
              <span class="muted">${i===0?"Goalkeeper": "Player "+(i+1)}</span>
              <select data-player-slot="${i}">
                ${players.map(q=>`<option value="${q.id}" ${STATE.lineup[i]===q.id?"selected":""}>${escapeHTML(q.name)} · ${q.position}</option>`).join("")}
              </select>
            </label>
          `).join("")}
        </div>
      </section>
    </div>
    <section class="panel" style="margin-top:16px">
      <div class="panel-title"><h3>Substitutes</h3><span class="badge">3 BENCH SLOTS</span></div>
      <div class="sub-list">
        ${STATE.substitutes.map(id=>{
          const p=players.find(q=>q.id===id);
          return `<div class="sub-slot"><strong>${escapeHTML(p?.name||"Grey Player")}</strong><br><span class="muted">${p?.position||"Outfield"}</span></div>`;
        }).join("")}
      </div>
      <p class="muted small" style="margin:13px 0 0">The three remaining players are your substitutes. Full bench selection and matchday changes will be added with the match system.</p>
    </section>
  `;
}

/* -----------------------------
   RUN
------------------------------ */

renderMenu();
</script>
</body>
</html>
